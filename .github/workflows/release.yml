name: Release to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish tagged package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x

      - name: Verify tag and project version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a supported v* version tag."
            exit 1
          fi

          checked_out_commit="$(git rev-parse HEAD)"
          release_tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$checked_out_commit" != "$release_tag_commit" ]]; then
            echo "::error::Checked-out commit '$checked_out_commit' is not tagged by '$RELEASE_TAG'."
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          project_version="$(dotnet msbuild AsyncSharp/AsyncSharp.csproj -nologo -getProperty:Version | tr -d '\r')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "::error::Tag version '$tag_version' does not match project Version '$project_version'."
            exit 1
          fi

          echo "PACKAGE_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore AsyncSharp.sln

      - name: Build
        run: >-
          dotnet build AsyncSharp.sln
          --configuration Release
          --no-restore
          -warnaserror
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test AsyncSharp.sln
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --blame-hang-timeout 2m

      - name: Pack tagged library
        run: >-
          dotnet pack AsyncSharp/AsyncSharp.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Verify package files
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/AsyncSharp.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/AsyncSharp.${PACKAGE_VERSION}.snupkg"

      - name: Restore package smoke test
        run: >-
          dotnet restore eng/PackageSmokeTest/PackageSmokeTest.csproj
          --source "${{ github.workspace }}/artifacts"
          --packages "${{ runner.temp }}/asyncsharp-smoke-packages"
          --force
          --no-cache
          -p:PackageVersionToTest="$PACKAGE_VERSION"

      - name: Run package smoke test
        run: >-
          dotnet run
          --project eng/PackageSmokeTest/PackageSmokeTest.csproj
          --configuration Release
          --no-restore
          -p:PackageVersionToTest="$PACKAGE_VERSION"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AsyncSharp-${{ env.PACKAGE_VERSION }}
          path: artifacts/*.*nupkg
          if-no-files-found: error

      - name: Exchange OIDC token for NuGet credentials
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/AsyncSharp.${PACKAGE_VERSION}.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --symbol-api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
